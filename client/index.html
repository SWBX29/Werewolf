<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>狼人杀联机</title>
    
    <!-- DNS 预解析和预连接 — 减少 WebSocket 连接建立时间 -->
    <link rel="dns-prefetch" href="//accesshub-wss.zego.im" />
    <link rel="preconnect" href="//accesshub-wss.zego.im" crossorigin />
    
    <!-- 骨架屏关键 CSS — 立即渲染，避免白屏 -->
    <style>
      /* 骨架屏基础样式 */
      .skeleton-root {
        position: fixed;
        inset: 0;
        z-index: 200;
        background-color: #0a0a0f;
        transition: opacity 0.3s ease-out;
      }
      .skeleton-hidden {
        opacity: 0;
        pointer-events: none;
      }
      .skeleton-container {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }
      .skeleton-pulse {
        background-color: rgba(55, 65, 81, 0.5);
        animation: skeleton-pulse 1.5s ease-in-out infinite;
        border-radius: 0.25rem;
      }
      @keyframes skeleton-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      .skeleton-card {
        background-color: rgba(30, 30, 40, 0.8);
        border: 1px solid rgba(75, 85, 99, 0.3);
        border-radius: 0.5rem;
        padding: 1rem;
      }
    </style>
  </head>
  <body class="bg-night-950 text-white min-h-screen">
    <!-- 骨架屏 — 立即显示，消除白屏 -->
    <div id="skeleton" class="skeleton-root">
      <div class="skeleton-container">
        <!-- 标题区域 -->
        <div style="text-align: center; margin-bottom: 2rem;">
          <div class="skeleton-pulse" style="height: 3rem; width: 12rem; margin: 0 auto 0.75rem;"></div>
          <div class="skeleton-pulse" style="height: 1rem; width: 16rem; margin: 0 auto;"></div>
        </div>
        <!-- 主卡片区域 -->
        <div style="width: 100%; max-width: 28rem;">
          <!-- 昵称输入框 -->
          <div class="skeleton-card" style="margin-bottom: 1.5rem;">
            <div class="skeleton-pulse" style="height: 1rem; width: 5rem; margin-bottom: 0.75rem;"></div>
            <div class="skeleton-pulse" style="height: 2.5rem; width: 100%;"></div>
          </div>
          <!-- 房间号输入框 -->
          <div class="skeleton-card" style="margin-bottom: 1.5rem;">
            <div class="skeleton-pulse" style="height: 1rem; width: 5rem; margin-bottom: 0.75rem;"></div>
            <div class="skeleton-pulse" style="height: 2.5rem; width: 100%;"></div>
          </div>
          <!-- 按钮区域 -->
          <div style="margin-bottom: 1.5rem;">
            <div class="skeleton-pulse" style="height: 3rem; width: 100%; border-radius: 0.5rem; margin-bottom: 0.75rem;"></div>
            <div class="skeleton-pulse" style="height: 3rem; width: 100%; border-radius: 0.5rem;"></div>
          </div>
          <!-- 底部链接 -->
          <div style="display: flex; justify-content: center; gap: 1rem;">
            <div class="skeleton-pulse" style="height: 1rem; width: 5rem;"></div>
            <div class="skeleton-pulse" style="height: 1rem; width: 5rem;"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
